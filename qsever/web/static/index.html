<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qsever - 高中解题助手</title>
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <h1>Qsever</h1>
        <span class="subtitle">高中解题助手</span>
      </div>
      <div class="header-right">
        <select id="profile-select" class="profile-select"></select>
        <button id="settings-btn" class="icon-btn" title="设置">⚙️</button>
        <button id="usage-btn" class="icon-btn" title="用量统计">📊</button>
        <button id="clear-btn" class="icon-btn" title="清空对话">🗑️</button>
      </div>
    </header>

    <main class="chat-area" id="chat-area">
      <div class="welcome-message" id="welcome-message">
        <h2>欢迎使用 Qsever</h2>
        <p>输入你的题目，我会为你详细解答</p>
        <p class="hint">支持数学公式（LaTeX 格式）、图片题目</p>
      </div>
    </main>

    <footer class="input-area">
      <div class="image-preview" id="image-preview"></div>
      <div class="input-row">
        <label class="upload-btn" title="上传图片">
          📎
          <input type="file" id="image-input" accept="image/*" multiple hidden>
        </label>
        <button id="gallery-btn" class="upload-btn" title="图片库">🖼️</button>
        <textarea id="message-input" placeholder="输入题目..." rows="1"></textarea>
        <button id="send-btn" class="send-btn" title="发送">➤</button>
      </div>
    </footer>
  </div>

  <div class="modal" id="usage-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>用量统计</h3>
        <button class="modal-close" id="usage-close">&times;</button>
      </div>
      <div class="modal-body" id="usage-body"></div>
    </div>
  </div>

  <div class="modal" id="settings-modal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3>设置</h3>
        <button class="modal-close" id="settings-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="settings-tabs">
          <button class="tab-btn active" data-tab="profiles">预设管理</button>
          <button class="tab-btn" data-tab="general">通用设置</button>
        </div>
        
        <div class="tab-content active" id="tab-profiles">
          <div id="profile-list"></div>
          <button id="add-profile-btn" class="btn-primary">+ 添加预设</button>
        </div>
        
        <div class="tab-content" id="tab-general">
          <div class="form-group">
            <label>预算上限（美元，-1 为不限）</label>
            <input type="number" id="setting-budget" step="0.01">
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" id="setting-auto-open"> 
              导出 HTML 后自动在浏览器打开
            </label>
          </div>
          <button id="save-settings-btn" class="btn-primary">保存设置</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="profile-form-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="profile-form-title">添加预设</h3>
        <button class="modal-close" id="profile-form-close">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="pf-original-name">
        <div class="form-group">
          <label>预设名称</label>
          <input type="text" id="pf-name" placeholder="例：我的GPT">
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input type="password" id="pf-api-key" placeholder="sk-...">
        </div>
        <div class="form-group">
          <label>Base URL</label>
          <input type="text" id="pf-base-url" placeholder="https://api.openai.com/v1">
        </div>
        <div class="form-group">
          <label>模型 ID</label>
          <input type="text" id="pf-model" placeholder="gpt-4o">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>输入价格</label>
            <input type="number" id="pf-input-price" step="0.01" placeholder="0">
          </div>
          <div class="form-group">
            <label>输出价格</label>
            <input type="number" id="pf-output-price" step="0.01" placeholder="0">
          </div>
        </div>
        <div class="form-actions">
          <button id="pf-save" class="btn-primary">保存</button>
          <button id="pf-cancel" class="btn-secondary">取消</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="gallery-modal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3>图片库</h3>
        <button class="modal-close" id="gallery-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="gallery-grid" class="gallery-grid"></div>
        <div id="gallery-empty" class="gallery-empty" style="display:none;">
          <p>图片库为空</p>
          <p class="hint">通过上方 📎 按钮上传图片</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
