[main]
profile = yapi

[settings]
images_dir = images
data_dir = data
budget_limit = 100.0
auto_open_html = true
output_dir = output

[yapi]
api_key = 你的API密钥
base_url = 你的API地址（OpenAI兼容格式）
models = 模型ID[:输入价[:输出价]], 模型ID[:输入价[:输出价]]

[openai]
api_key = sk-xxx
base_url = https://api.openai.com/v1
models = gpt-4o:2.5:10, gpt-4o-mini:0.15:0.6
