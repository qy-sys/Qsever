[main]
profile = 

[settings]
images_dir = images
data_dir = data
budget_limit = 100.0
auto_open_html = true
output_dir = output

# 配置示例（复制下面的格式，创建你自己的配置节）
# 
# [我的API]
# api_key = 你的API密钥
# base_url = 你的API地址（OpenAI兼容格式）
# model = 模型名称[:输入价格[:输出价格]]
#
# 然后在 [main] 的 profile 中填写配置节名称
# 
# 价格说明（可选，单位：美元/百万tokens）：
#   - 不填价格：model = gpt-4o
#   - 只填输入价：model = gpt-4o:2.5（输出价自动按输入价×2.5计算）
#   - 完整价格：model = gpt-4o:2.5:10
